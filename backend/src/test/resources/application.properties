# Configuración SOLO para las pruebas (se suma a src/main/resources/application.yml).
# Clave de administración fija para que las pruebas no dependan del .env de cada computador.
# No es una clave real: en la aplicación la clave sale de STYLEME_ADMIN_CLAVE.
styleme.admin.clave=clave-solo-para-pruebas

# El probador con IA queda apagado en las pruebas (no se llama a ningún proveedor de imágenes)
styleme.probador.proveedor=ninguno
