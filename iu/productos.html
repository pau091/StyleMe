<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos · StyleMe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/estilos.css">
  <link rel="stylesheet" href="assets/css/movimiento.css">
  <link rel="stylesheet" href="assets/css/intro.css">
  <link rel="stylesheet" href="assets/css/lia.css">
  <link rel="stylesheet" href="assets/lia/lia-2d.css">
  <!-- Deben ir aquí, en el head: preparan la intro 3D, las puertas entre páginas y las animaciones antes de que se vea la página -->
  <script src="assets/js/arranque.js"></script>
  <script src="assets/js/intro.js"></script>
</head>
<body>
  <header id="encabezado"></header>

  <main class="contenedor">
    <h1 class="titulo-lineas">Productos</h1>
    <p class="aviso" data-revelar style="--orden:2">Los precios y la disponibilidad pueden cambiar. Confírmalos con la tienda por WhatsApp.</p>

    <div class="filtros" data-revelar style="--orden:3">
      <div>
        <label for="filtro-texto">Buscar</label>
        <input type="search" id="filtro-texto" placeholder="Ej: algo para que no me brille la cara">
      </div>
      <div>
        <label for="filtro-categoria">Categoría</label>
        <select id="filtro-categoria">
          <option value="">Todas</option>
          <option value="ropa">Ropa y moda</option>
          <option value="maquillaje">Maquillaje</option>
          <option value="skincare">Skincare</option>
          <option value="capilar">Cuidado capilar</option>
        </select>
      </div>
      <div>
        <label for="filtro-precio">Precio máximo</label>
        <input type="number" id="filtro-precio" min="0" step="5000" placeholder="Ej: 80000">
      </div>
      <div>
        <label for="filtro-tienda">Tienda</label>
        <select id="filtro-tienda">
          <option value="">Todas</option>
        </select>
      </div>
    </div>

    <p class="texto-suave" id="contador" data-revelar style="--orden:4"></p>
    <p class="texto-suave" id="modo-busqueda" aria-live="polite"></p>
    <div class="cuadricula" id="lista-productos" data-cascada></div>
  </main>

  <footer id="pie"></footer>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/comun.js"></script>
  <script src="assets/js/productos.js"></script>
  <!-- Lía, la asesora virtual (personaje con globos de texto) -->
  <script src="assets/js/lia/plan-b.js"></script>
  <script src="assets/js/lia/lia.js"></script>
  <script src="assets/js/movimiento.js"></script>
</body>
</html>
