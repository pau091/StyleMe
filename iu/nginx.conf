# SERVIDOR DE LA PÁGINA (nginx, dentro de Docker)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  # Fotos del probador con IA (la de la persona y la de la tienda)
  client_max_body_size 20m;

  # Comprimir texto (HTML, CSS, JS, JSON): la página carga más rápido
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/x-ndjson;

  # La API, Swagger y el estado del backend se reenvían al contenedor "backend"
  location ~ ^/(api|v3/api-docs|swagger-ui|swagger-ui\.html|actuator)(/|$) {
    proxy_pass http://backend:8090;
    proxy_set_header Host $host;
    # La IP real de la persona (el límite de mensajes de Lía es por persona)
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Lía responde por partes (streaming): nginx no debe esperar a tener la respuesta completa
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  # Imágenes, estilos y scripts: el navegador los guarda un día
  location ~* \.(jpg|jpeg|png|webp|svg|css|js)$ {
    expires 1d;
    add_header Cache-Control "public";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
