<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiendas · StyleMe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/estilos.css">
  <link rel="stylesheet" href="assets/css/movimiento.css">
  <link rel="stylesheet" href="assets/css/intro.css">
  <link rel="stylesheet" href="assets/css/lia.css">
  <link rel="stylesheet" href="assets/lia/lia-2d.css">
  <!-- Deben ir aquí, en el head: preparan la intro 3D, las puertas entre páginas y las animaciones antes de que se vea la página -->
  <script src="assets/js/arranque.js"></script>
  <script src="assets/js/intro.js"></script>
</head>
<body>
  <header id="encabezado"></header>

  <main class="contenedor">
    <h1 class="titulo-lineas">Tiendas</h1>
    <p class="texto-suave" data-revelar style="--orden:2">Tiendas locales de Bucaramanga.</p>

    <div class="filtros" data-revelar style="--orden:3">
      <div>
        <label for="filtro-texto">Buscar tienda</label>
        <input type="search" id="filtro-texto" placeholder="Nombre o barrio">
      </div>
      <div>
        <label for="filtro-tipo">Tipo</label>
        <select id="filtro-tipo">
          <option value="">Todas</option>
          <option value="ropa">Ropa y moda</option>
          <option value="maquillaje">Maquillaje y belleza</option>
        </select>
      </div>
    </div>

    <div class="cuadricula" id="lista-tiendas" data-cascada></div>
  </main>

  <footer id="pie"></footer>

  <script src="data/tiendas.js"></script>
  <script src="data/productos.js"></script>
  <script src="assets/js/comun.js"></script>
  <script src="assets/js/tiendas.js"></script>
  <!-- Lía, la asesora virtual (personaje con globos de texto) -->
  <script src="assets/js/lia/plan-b.js"></script>
  <script src="assets/js/lia/lia.js"></script>
  <script src="assets/js/movimiento.js"></script>
</body>
</html>
